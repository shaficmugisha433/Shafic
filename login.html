<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RentManager Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style.responsive.css">
</head>

<body class="min-h-screen bg-slate-950 p-4 text-slate-900">
    <main
        class="mx-auto grid min-h-[calc(100vh-2rem)] max-w-6xl overflow-hidden rounded-3xl bg-white shadow-2xl lg:grid-cols-[1.1fr_.9fr]">
        <section
            class="relative hidden overflow-hidden bg-indigo-700 p-12 text-white lg:flex lg:flex-col lg:justify-between">
            <div class="absolute -right-20 -top-20 h-72 w-72 rounded-full bg-indigo-500/30 blur-3xl"></div>
            <div class="relative">
                <div class="mb-8 flex h-12 w-12 items-center justify-center rounded-xl bg-white text-indigo-700"><i
                        data-lucide="building-2" class="h-6 w-6"></i></div>
                <h1 class="text-4xl font-bold">Manage every property with confidence.</h1>
                <p class="mt-5 max-w-md text-indigo-100">Track tenants, leases, payments, maintenance, and reports from
                    one secure workspace.</p>
            </div>
            <div class="relative grid gap-3 sm:grid-cols-2">
                <img src="assets/onboarding-properties.svg" alt="Tenant room availability and rental property illustration" class="h-36 w-full rounded-2xl border border-white/20 object-cover">
                <img src="assets/onboarding-communication.svg" alt="Tenant communication illustration" class="h-36 w-full rounded-2xl border border-white/20 object-cover">
            </div>
            <div class="relative grid grid-cols-3 gap-4 text-sm">
                <div class="rounded-xl bg-white/10 p-4"><strong class="block text-2xl">12</strong>Properties</div>
                <div class="rounded-xl bg-white/10 p-4"><strong class="block text-2xl">84</strong>Tenants</div>
                <div class="rounded-xl bg-white/10 p-4"><strong class="block text-2xl">98%</strong>On-time</div>
            </div>
        </section>
        <section class="flex items-center p-8 sm:p-12">
            <form class="w-full max-w-md" id="login-form">
                <div class="mb-8"><span class="text-xs font-bold uppercase tracking-[.2em] text-indigo-600">Welcome
                        back</span>
                    <h2 class="mt-3 text-3xl font-bold">Sign in to RentManager</h2>
                    <p class="mt-2 text-sm text-slate-500">Choose the account type you want to use.</p>
                </div><label class="mb-2 block text-sm font-semibold">Account type</label>
                <div class="mb-5 grid grid-cols-2 gap-2">
                    <button type="button" data-role-option="admin" class="role-option rounded-xl border-2 border-indigo-600 bg-indigo-50 p-3 text-left text-sm font-semibold text-indigo-700">Admin / Landlord</button>
                    <button type="button" data-role-option="tenant" class="role-option rounded-xl border-2 border-slate-200 p-3 text-left text-sm font-semibold text-slate-600">Tenant</button>
                </div><input id="account-role" type="hidden" value="admin"><label class="mb-2 block text-sm font-semibold">Email address</label>
                <div
                    class="mb-5 flex items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 focus-within:border-indigo-500 focus-within:ring-4 focus-within:ring-indigo-100">
                    <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i><input id="login-email" type="email"
                        value="shafic@rentmanager.com" required class="w-full bg-transparent outline-none"></div><label
                    class="mb-2 block text-sm font-semibold">Password</label>
                <div
                    class="mb-5 flex items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 focus-within:border-indigo-500 focus-within:ring-4 focus-within:ring-indigo-100">
                    <i data-lucide="lock-keyhole" class="h-5 w-5 text-slate-400"></i><input id="login-password"
                        type="password" value="rentmanager" required class="w-full bg-transparent outline-none"></div>
                <div class="mb-6 flex items-center justify-between text-sm"><label
                        class="flex items-center gap-2"><input type="checkbox" checked> Remember me</label><a href="#"
                        class="text-indigo-600">Forgot password?</a></div><button type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 py-3 font-semibold text-white transition hover:bg-indigo-700">Sign
                    in <i data-lucide="arrow-right" class="h-4 w-4"></i></button>
                <p class="mt-6 text-center text-sm text-slate-500">New tenant? <a href="signup.html"
                        class="font-semibold text-indigo-600">Create a tenant account</a></p>
            </form>
        </section>
    </main>
    <div id="toast"
        class="fixed bottom-5 right-5 z-50 translate-y-6 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white opacity-0 transition">
    </div>
    <script src="assets/app.js"></script>
    <script>
      const roleInput = document.getElementById('account-role');
      document.querySelectorAll('[data-role-option]').forEach(option => {
        option.addEventListener('click', () => {
          roleInput.value = option.dataset.roleOption;
          document.querySelectorAll('[data-role-option]').forEach(item => {
            const selected = item === option;
            item.classList.toggle('border-indigo-600', selected);
            item.classList.toggle('bg-indigo-50', selected);
            item.classList.toggle('text-indigo-700', selected);
            item.classList.toggle('border-slate-200', !selected);
            item.classList.toggle('bg-white', !selected);
            item.classList.toggle('text-slate-600', !selected);
          });
        });
      });
      document.getElementById('login-form').addEventListener('submit', event => {
        event.preventDefault();
        const role = roleInput.value;
        const email = document.getElementById('login-email').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value;

        if (role === 'tenant') {
          const accounts = JSON.parse(localStorage.getItem('rentmanager-tenant-accounts') || '[]');
          const account = accounts.find(item => item.email === email && item.password === password);
          if (!account) {
            showToast('Tenant account not found. Create a tenant account first.');
            return;
          }
          localStorage.setItem('rentmanager-current-user', JSON.stringify({ name: account.name, email: account.email, role: 'tenant' }));
          location.href = 'tenant/index.html';
        } else {
          location.href = 'dashboard.html';
        }
      });
    </script>
</body>

</html>
